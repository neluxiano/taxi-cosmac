<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro de Bordo — Avaliações de Passageiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --asphalt:#17181C;
    --amber:#FFB800;
    --amber-dim:#8a6400;
    --paper:#F6F1E4;
    --paper-dark:#EDE6D3;
    --ink:#2B2A28;
    --ink-soft:#6b6558;
    --meter-red:#D64545;
    --route-green:#3C8A5D;
    --line:#d9d0b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:var(--asphalt);}

  /* ---------- HEADER ---------- */
  header{
    background:var(--asphalt);
    color:var(--paper);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
    border-bottom:6px solid var(--amber);
  }
  header::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:100%;
    background:
      repeating-linear-gradient(135deg, rgba(255,184,0,0.05) 0 12px, transparent 12px 24px);
    pointer-events:none;
  }
  .header-inner{
    max-width:720px;
    margin:0 auto;
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand-eyebrow{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--amber);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(28px,6vw,40px);
    letter-spacing:.01em;
    margin:0;
    line-height:1;
  }
  .brand-sub{
    font-size:13px;
    color:#c9c4b6;
    margin:8px 0 0;
    max-width:340px;
  }
  .meter-stats{
    display:flex;
    gap:14px;
  }
  .meter-box{
    background:#0e0f12;
    border:1px solid #333;
    border-radius:4px;
    padding:10px 16px;
    text-align:center;
    min-width:92px;
  }
  .meter-box .val{
    font-family:'Roboto Mono',monospace;
    font-size:22px;
    font-weight:700;
    color:var(--amber);
    letter-spacing:.03em;
  }
  .meter-box .lbl{
    font-family:'Roboto Mono',monospace;
    font-size:9px;
    letter-spacing:.12em;
    color:#8f8a7c;
    text-transform:uppercase;
    margin-top:2px;
  }

  /* ---------- MAIN ---------- */
  main{
    max-width:720px;
    margin:0 auto;
    padding:22px 20px 80px;
  }

  /* search / meter keypad */
  .search-panel{
    background:var(--asphalt);
    border-radius:8px;
    padding:14px;
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
  }
  .search-panel label{
    display:none;
  }
  .search-panel .hash{
    font-family:'Roboto Mono',monospace;
    color:var(--amber);
    font-weight:700;
    font-size:15px;
    padding-left:6px;
  }
  .search-panel input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    font-family:'Roboto Mono',monospace;
    font-size:16px;
    letter-spacing:.05em;
    color:var(--paper);
    padding:8px 4px;
  }
  .search-panel input::placeholder{color:#6f6a5c;}
  .search-panel button{
    background:var(--amber);
    border:none;
    color:var(--asphalt);
    font-family:'Roboto Mono',monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:.08em;
    padding:10px 14px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .search-panel button:hover{background:#ffc531;}
  .search-panel .clear-btn{
    background:transparent;
    color:#9b9686;
    border:1px solid #3a3a3a;
  }
  .search-panel .clear-btn:hover{color:var(--paper);border-color:#666;}

  .search-summary{
    display:none;
    background:var(--paper-dark);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:12px 16px;
    margin:-6px 0 18px;
    font-family:'Roboto Mono',monospace;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .search-summary.active{display:flex;}
  .search-summary .stars-mini{color:var(--amber);letter-spacing:2px;}

  /* new review toggle + form */
  .new-toggle{
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:8px;
    padding:13px;
    font-family:'Archivo Black',sans-serif;
    font-size:13px;
    letter-spacing:.05em;
    cursor:pointer;
    margin-bottom:18px;
  }
  .new-toggle:hover{background:#3a382f;}

  .new-form{
    display:none;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:24px;
  }
  .new-form.open{display:block;}
  .form-row{margin-bottom:14px;}
  .form-row label{
    display:block;
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .form-row input[type="text"],
  .form-row input[type="number"],
  .form-row textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:var(--paper);
    color:var(--ink);
    resize:none;
  }
  .form-row input:focus,
  .form-row textarea:focus{
    outline:none;
    border-color:var(--amber-dim);
    background:#fffdf7;
  }
  .star-picker{display:flex;gap:6px;}
  .star-picker button{
    background:none;
    border:none;
    font-size:28px;
    cursor:pointer;
    color:var(--line);
    line-height:1;
    padding:2px;
  }
  .star-picker button.filled{color:var(--amber);}
  .char-counter{
    text-align:right;
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .char-counter.warn{color:var(--meter-red);}
  .form-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
  }
  .btn-cancel{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:10px 16px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    cursor:pointer;
  }
  .btn-submit{
    background:var(--amber);
    border:none;
    color:var(--asphalt);
    font-weight:700;
    padding:10px 18px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    cursor:pointer;
  }
  .btn-submit:disabled{opacity:.4;cursor:not-allowed;}
  .btn-submit:not(:disabled):hover{background:#ffc531;}
  .form-error{
    font-family:'Roboto Mono',monospace;
    font-size:11.5px;
    color:var(--meter-red);
    margin-bottom:10px;
    display:none;
  }
  .form-error.show{display:block;}

  /* feed */
  .feed-label{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 12px 2px;
  }
  .feed{display:flex;flex-direction:column;gap:16px;}

  .ticket{
    position:relative;
    background:#fff;
    border-radius:6px;
    box-shadow:0 1px 3px rgba(23,24,28,0.08), 0 1px 1px rgba(23,24,28,0.06);
  }
  .ticket-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:14px 18px 12px;
    gap:12px;
  }
  .passenger-id{
    font-family:'Roboto Mono',monospace;
    font-weight:700;
    font-size:19px;
    letter-spacing:.02em;
  }
  .passenger-id span{
    color:var(--ink-soft);
    font-weight:400;
    font-size:12px;
    display:block;
    margin-top:2px;
  }
  .ticket-date{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
    padding-top:2px;
  }
  .stars-row{
    padding:0 18px 12px;
    color:var(--amber);
    font-size:17px;
    letter-spacing:2px;
  }
  .stars-row .num{
    font-family:'Roboto Mono',monospace;
    color:var(--ink-soft);
    font-size:11px;
    margin-left:8px;
    letter-spacing:0;
  }

  /* perforated divider */
  .perf{
    position:relative;
    height:0;
    border-top:2px dashed var(--line);
    margin:0 -1px;
  }
  .perf::before,.perf::after{
    content:"";
    position:absolute;
    top:-9px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--paper);
  }
  .perf::before{left:-9px;}
  .perf::after{right:-9px;}

  .ticket-body{
    padding:14px 18px 16px;
  }
  .comment{
    font-size:14.5px;
    line-height:1.5;
    color:var(--ink);
    margin:0 0 10px;
  }
  .comment.empty{
    color:var(--ink-soft);
    font-style:italic;
  }
  .ticket-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .driver-chip{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    background:var(--paper-dark);
    color:var(--ink-soft);
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
  }
  .rating-tag{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
    letter-spacing:.04em;
  }
  .rating-tag.good{background:rgba(60,138,93,0.12);color:var(--route-green);}
  .rating-tag.mid{background:rgba(255,184,0,0.15);color:var(--amber-dim);}
  .rating-tag.bad{background:rgba(214,69,69,0.12);color:var(--meter-red);}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:'Archivo Black',sans-serif;
    font-size:18px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .empty-state .small{
    font-family:'Roboto Mono',monospace;
    font-size:12px;
  }

  .config-banner{
    background:#fff4d6;
    border:1px solid var(--amber-dim);
    color:#5c4600;
    border-radius:8px;
    padding:14px 16px;
    font-family:'Roboto Mono',monospace;
    font-size:12px;
    line-height:1.6;
    margin-bottom:18px;
  }
  .config-banner code{
    background:#00000010;
    padding:1px 5px;
    border-radius:3px;
  }
  .loading-msg{
    text-align:center;
    padding:40px;
    font-family:'Roboto Mono',monospace;
    color:var(--ink-soft);
    font-size:12px;
    letter-spacing:.08em;
  }

  @media (prefers-reduced-motion: no-preference){
    .new-form.open{animation:slideDown .18s ease;}
    @keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
    .ticket{animation:fadeIn .25s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  }

  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--amber-dim);
    outline-offset:2px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <p class="brand-eyebrow">Uso interno &middot; classe táxi</p>
      <h1>LIVRO DE&nbsp;BORDO</h1>
      <p class="brand-sub">Registro de avaliações de passageiros feitas por taxistas ao fim de cada corrida.</p>
    </div>
    <div class="meter-stats">
      <div class="meter-box">
        <div class="val" id="statTotal">--</div>
        <div class="lbl">Corridas</div>
      </div>
      <div class="meter-box">
        <div class="val" id="statAvg">--</div>
        <div class="lbl">Média geral</div>
      </div>
    </div>
  </div>
</header>

<main>

  <div class="config-banner" id="configBanner" style="display:none;"></div>

  <div class="search-panel">
    <span class="hash">Nº</span>
    <input type="text" id="searchInput" inputmode="numeric" placeholder="Buscar por número do passageiro (ex: 4521)">
    <button class="clear-btn" id="clearBtn" style="display:none;">Limpar</button>
    <button id="searchBtn">Buscar</button>
  </div>

  <div class="search-summary" id="searchSummary"></div>

  <button class="new-toggle" id="toggleForm">+ REGISTRAR NOVA AVALIAÇÃO</button>

  <div class="new-form" id="newForm">
    <div class="form-error" id="formError"></div>
    <div class="form-row">
      <label for="fPassenger">Número do passageiro</label>
      <input type="text" id="fPassenger" inputmode="numeric" placeholder="Ex: 4521">
    </div>
    <div class="form-row">
      <label>Avaliação</label>
      <div class="star-picker" id="starPicker">
        <button type="button" data-v="1">★</button>
        <button type="button" data-v="2">★</button>
        <button type="button" data-v="3">★</button>
        <button type="button" data-v="4">★</button>
        <button type="button" data-v="5">★</button>
      </div>
    </div>
    <div class="form-row">
      <label for="fComment">Comentário (opcional)</label>
      <textarea id="fComment" rows="3" maxlength="180" placeholder="Ex: Passageiro pontual, corrida tranquila."></textarea>
      <div class="char-counter" id="charCounter">0 / 180</div>
    </div>
    <div class="form-row">
      <label for="fDriver">Seu nome (opcional)</label>
      <input type="text" id="fDriver" placeholder="Ex: Carlos M.">
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="cancelForm">Cancelar</button>
      <button class="btn-submit" id="submitForm" disabled>Registrar corrida</button>
    </div>
  </div>

  <p class="feed-label" id="feedLabel">Corridas registradas</p>
  <div class="feed" id="feed">
    <div class="loading-msg">Carregando registros…</div>
  </div>

</main>

<script>
(function(){

  // ============================================================
  // CONFIGURAÇÃO DO SUPABASE — preencha com os dados do seu projeto
  // 1. Crie um projeto em https://supabase.com
  // 2. Vá em Project Settings > API
  // 3. Copie "Project URL" e "anon public key" para as duas linhas abaixo
  // ============================================================
  const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
  const SUPABASE_ANON_KEY = "SUA-CHAVE-ANON-AQUI";
  // ============================================================

  const isConfigured = !SUPABASE_URL.includes('SEU-PROJETO') && !SUPABASE_ANON_KEY.includes('SUA-CHAVE');
  const supabaseClient = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  let reviews = [];
  let currentSearch = "";
  let selectedStars = 0;

  const configBanner = document.getElementById('configBanner');
  const feedEl = document.getElementById('feed');
  const feedLabel = document.getElementById('feedLabel');
  const statTotal = document.getElementById('statTotal');
  const statAvg = document.getElementById('statAvg');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const searchSummary = document.getElementById('searchSummary');
  const toggleForm = document.getElementById('toggleForm');
  const newForm = document.getElementById('newForm');
  const cancelForm = document.getElementById('cancelForm');
  const submitForm = document.getElementById('submitForm');
  const starPicker = document.getElementById('starPicker');
  const fPassenger = document.getElementById('fPassenger');
  const fComment = document.getElementById('fComment');
  const fDriver = document.getElementById('fDriver');
  const charCounter = document.getElementById('charCounter');
  const formError = document.getElementById('formError');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'}) + ' · ' +
           d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }

  function starsToStr(n){
    return '★★★★★☆☆☆☆☆'.slice(5-n, 10-n);
  }

  function ratingClass(n){
    if(n >= 4) return 'good';
    if(n >= 3) return 'mid';
    return 'bad';
  }

  function showConfigBanner(msg){
    configBanner.style.display = 'block';
    configBanner.innerHTML = msg;
  }

  async function loadReviews(){
    if(!isConfigured){
      showConfigBanner(
        'Banco ainda não configurado. Edite as constantes <code>SUPABASE_URL</code> e ' +
        '<code>SUPABASE_ANON_KEY</code> no início do &lt;script&gt; deste arquivo com os dados ' +
        'do seu projeto Supabase. Veja as instruções de configuração enviadas junto com este arquivo.'
      );
      feedEl.innerHTML = '<div class="empty-state"><div class="big">Banco não conectado</div><div class="small">CONFIGURE O SUPABASE PARA COMEÇAR A REGISTRAR CORRIDAS</div></div>';
      statTotal.textContent = '--';
      statAvg.textContent = '--';
      return;
    }
    try{
      const { data, error } = await supabaseClient
        .from('reviews')
        .select('*')
        .order('created_at', { ascending: false });
      if(error) throw error;
      reviews = (data || []).map(r => ({
        id: r.id,
        passenger: r.passenger,
        stars: r.stars,
        comment: r.comment || '',
        driver: r.driver || '',
        date: r.created_at
      }));
      render();
    }catch(e){
      console.error(e);
      showConfigBanner(
        'Não foi possível conectar ao banco. Confira se a URL e a chave anon estão corretas, ' +
        'e se a tabela <code>reviews</code> existe com as permissões (RLS) liberadas. Detalhe: ' +
        escapeHtml(e.message || String(e))
      );
    }
  }

  async function insertReview(entry){
    const { data, error } = await supabaseClient
      .from('reviews')
      .insert([{
        passenger: entry.passenger,
        stars: entry.stars,
        comment: entry.comment,
        driver: entry.driver
      }])
      .select();
    if(error) throw error;
    return data[0];
  }

  function render(){
    // stats
    statTotal.textContent = reviews.length;
    if(reviews.length){
      const avg = reviews.reduce((s,r)=>s+r.stars,0) / reviews.length;
      statAvg.textContent = avg.toFixed(1);
    } else {
      statAvg.textContent = '—';
    }

    // filter
    let list = reviews;
    if(currentSearch){
      list = reviews.filter(r => r.passenger.includes(currentSearch));
    }
    list = [...list].sort((a,b)=> new Date(b.date) - new Date(a.date));

    // summary block for search
    if(currentSearch && list.length){
      const avg = (list.reduce((s,r)=>s+r.stars,0) / list.length).toFixed(1);
      searchSummary.classList.add('active');
      searchSummary.innerHTML =
        `<span>Passageiro <strong>#${escapeHtml(currentSearch)}</strong> — ${list.length} corrida${list.length>1?'s':''} avaliada${list.length>1?'s':''}</span>` +
        `<span class="stars-mini">${starsToStr(Math.round(avg))} <span style="color:var(--ink-soft);letter-spacing:0;">média ${avg}</span></span>`;
      feedLabel.textContent = `Resultados para "${currentSearch}"`;
    } else if(currentSearch){
      searchSummary.classList.remove('active');
      feedLabel.textContent = `Resultados para "${currentSearch}"`;
    } else {
      searchSummary.classList.remove('active');
      feedLabel.textContent = 'Corridas registradas';
    }

    // feed
    if(!list.length){
      feedEl.innerHTML = currentSearch
        ? `<div class="empty-state"><div class="big">Nenhum passageiro encontrado</div><div class="small">NENHUM REGISTRO PARA O Nº "${escapeHtml(currentSearch)}"</div></div>`
        : `<div class="empty-state"><div class="big">Nenhuma corrida registrada ainda</div><div class="small">TOQUE EM "REGISTRAR NOVA AVALIAÇÃO" PARA COMEÇAR</div></div>`;
      return;
    }

    feedEl.innerHTML = list.map(r => `
      <div class="ticket">
        <div class="ticket-top">
          <div class="passenger-id">Nº ${escapeHtml(r.passenger)}<span>Passageiro</span></div>
          <div class="ticket-date">${formatDate(r.date)}</div>
        </div>
        <div class="stars-row">${starsToStr(r.stars)}<span class="num">${r.stars}/5</span></div>
        <div class="perf"></div>
        <div class="ticket-body">
          <p class="comment ${r.comment ? '' : 'empty'}">${r.comment ? escapeHtml(r.comment) : 'Sem comentário.'}</p>
          <div class="ticket-footer">
            <span class="driver-chip">${r.driver ? escapeHtml(r.driver) : 'Motorista não identificado'}</span>
            <span class="rating-tag ${ratingClass(r.stars)}">${r.stars >= 4 ? 'BOM PASSAGEIRO' : r.stars >= 3 ? 'REGULAR' : 'ATENÇÃO'}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // search
  function doSearch(){
    currentSearch = searchInput.value.trim();
    clearBtn.style.display = currentSearch ? 'inline-block' : 'none';
    render();
  }
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    currentSearch = '';
    clearBtn.style.display = 'none';
    render();
  });

  // toggle form
  toggleForm.addEventListener('click', () => {
    newForm.classList.add('open');
    toggleForm.style.display = 'none';
  });
  cancelForm.addEventListener('click', closeForm);

  function closeForm(){
    newForm.classList.remove('open');
    toggleForm.style.display = 'block';
    fPassenger.value = '';
    fComment.value = '';
    fDriver.value = '';
    selectedStars = 0;
    updateStars();
    updateCounter();
    formError.classList.remove('show');
  }

  // stars
  starPicker.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    selectedStars = parseInt(btn.dataset.v, 10);
    updateStars();
    validateForm();
  });
  function updateStars(){
    [...starPicker.children].forEach(b => {
      b.classList.toggle('filled', parseInt(b.dataset.v,10) <= selectedStars);
    });
  }

  // char counter
  fComment.addEventListener('input', () => { updateCounter(); validateForm(); });
  function updateCounter(){
    const len = fComment.value.length;
    charCounter.textContent = `${len} / 180`;
    charCounter.classList.toggle('warn', len >= 160);
  }
  fPassenger.addEventListener('input', validateForm);

  function validateForm(){
    const ok = fPassenger.value.trim().length > 0 && selectedStars > 0;
    submitForm.disabled = !ok;
    formError.classList.remove('show');
  }

  submitForm.addEventListener('click', async () => {
    const passenger = fPassenger.value.trim();
    if(!passenger || selectedStars === 0){
      formError.textContent = 'Informe o número do passageiro e selecione uma avaliação.';
      formError.classList.add('show');
      return;
    }
    if(!isConfigured){
      formError.textContent = 'Configure o Supabase (SUPABASE_URL e SUPABASE_ANON_KEY) antes de registrar corridas.';
      formError.classList.add('show');
      return;
    }
    submitForm.disabled = true;
    submitForm.textContent = 'Registrando…';

    const entry = {
      passenger: passenger,
      stars: selectedStars,
      comment: fComment.value.trim().slice(0,180),
      driver: fDriver.value.trim()
    };

    try{
      const saved = await insertReview(entry);
      reviews.push({
        id: saved.id,
        passenger: saved.passenger,
        stars: saved.stars,
        comment: saved.comment || '',
        driver: saved.driver || '',
        date: saved.created_at
      });
      render();
      closeForm();
    }catch(e){
      console.error(e);
      formError.textContent = 'Erro ao salvar no banco: ' + (e.message || e);
      formError.classList.add('show');
    }finally{
      submitForm.textContent = 'Registrar corrida';
      submitForm.disabled = false;
    }
  });

  loadReviews();
})();
</script>

</body>
</html>
