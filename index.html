<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faturas de Táxi</title>
<style>
:root{--bg:#eef1f6;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#0a6cff;--tint:#f1f6ff;--band:#d4e5ff;--bar:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--bar:#1a1f29;--ink-ui:#e5e7eb}}
:root[data-theme="dark"]{--bg:#0f1218;--bar:#1a1f29;--ink-ui:#e5e7eb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:820px;margin:14px auto;padding:10px 14px;background:var(--bar);border-radius:10px;color:var(--ink-ui,#111827)}
.bar b{font-size:15px}
button,select{font:inherit;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sheet{max-width:820px;margin:0 auto 30px;background:#fff;color:var(--ink);padding:40px 44px;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
input,textarea,select.f{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px dashed #cbd5e1;padding:3px 2px;width:100%;border-radius:0}
input:hover,textarea:hover{background:var(--tint)}
textarea{resize:vertical;min-height:54px}
.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.logo{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:30px;letter-spacing:-1px}
.logo input{text-align:center;color:#fff;font-weight:800;font-size:21px;border:0;width:84px}
.logo input:hover{background:transparent}
.title{text-align:right;flex:1}
.title h1{margin:0 0 10px;font-size:30px;letter-spacing:-.5px}
.meta{display:grid;grid-template-columns:auto 130px;gap:4px 10px;justify-content:end;align-items:center;color:var(--muted);font-size:12.5px}
.meta input{text-align:right;color:var(--ink)}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:34px 0}
.parties h3,.sec h3{margin:0 0 6px;font-size:13px}
.parties .r input,.parties .r textarea{text-align:right}
.parties input.big{font-size:19px;font-weight:700}
.route{border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:14px;break-inside:avoid}.thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.thead h3{margin:0}.thead button{padding:4px 9px;font-size:12px;margin-left:4px}.thead .x{border:0}.thd,.trow{display:grid;grid-template-columns:1fr 128px 54px 90px 100px 76px;gap:8px;align-items:center}.thd{background:var(--accent);color:#fff;font-size:11.5px;padding:8px 6px;text-align:right;-webkit-print-color-adjust:exact;print-color-adjust:exact}.thd span:first-child,.thd span:nth-child(2){text-align:left}.per{display:flex;flex-direction:column;gap:2px}.pl{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:11px;color:var(--muted)}.pl input{width:100px;text-align:left;font-size:12px;padding:1px}.trow{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:5px 6px;border-bottom:1px solid var(--line);break-inside:avoid}.trow:nth-child(even){background:var(--band)}.trow input{text-align:right}.rt{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.rt .sw{flex:none;width:100%}.rt .ar{display:none}.rt input{flex:1 1 120px;min-width:100px;text-align:left}.rt .ar{color:var(--accent);font-weight:700}.mk{width:12px;height:12px;flex:none;margin-right:6px}.mk{-webkit-print-color-adjust:exact;print-color-adjust:exact}.mk.a{border-radius:50%;background:var(--ink)}.mk.z{background:var(--ink);border-radius:2px}.mk.m{width:9px;height:9px;border:2px solid var(--ink);transform:rotate(45deg);margin:0 8px 0 3px}.sw input{flex:1;min-width:0}.sw{display:flex;flex:1 1 130px;align-items:center}.sw .x{padding:0 4px}.ttot{text-align:right;font-weight:600;white-space:nowrap}.acts{display:flex;gap:2px;justify-content:flex-end}.acts button{padding:3px 7px;border-color:transparent}.fld{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}.fld input{width:auto;min-width:80px}
.route h3{margin:0 0 12px;font-size:13px}
.stop{display:grid;grid-template-columns:22px 1fr 30px;gap:10px;align-items:center;position:relative;padding-bottom:10px}
.stop::before{content:"";position:absolute;left:8px;top:18px;bottom:-4px;border-left:2px dotted #a8b4c8}
.stop:last-of-type::before{display:none}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--accent);background:#fff}
.dot.a{background:var(--accent)}
.dot.z{border-radius:3px;background:var(--ink);border-color:var(--ink)}
.stop label{display:block;font-size:11px;color:var(--muted)}
.x{border:0;color:#b91c1c;padding:2px 6px;font-size:18px}
.rkm{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;align-items:flex-end}

table{width:100%;border-collapse:collapse;margin-bottom:20px}
th{background:var(--accent);color:#fff;font-weight:500;font-size:11.5px;text-align:right;padding:8px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:6px 4px;vertical-align:top}
tbody tr:nth-child(even){background:var(--band)}
td input{text-align:right}td:first-child input{text-align:left}
td.amt{text-align:right;padding:9px 6px;white-space:nowrap}
.addrow{margin:-8px 0 20px}
.bottom{display:grid;grid-template-columns:1fr 300px;gap:30px}
.tot{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:13px}
.tot .v{text-align:right;white-space:nowrap}
.tot input{width:70px;text-align:right;display:inline-block}
.tot .due{background:var(--tint);padding:12px 10px;margin:4px -10px 0;font-weight:700;font-size:15px;grid-column:1/-1;display:flex;justify-content:space-between}
.tot .sub{font-weight:700}
.sign{margin-top:10px;padding-top:80px;display:flex;justify-content:flex-end}.sign div{position:relative}.sign img{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);height:76px;margin-bottom:-6px;pointer-events:none}
.sign div{width:220px;border-top:1px solid #94a3b8;text-align:center;padding-top:4px;font-size:12px;color:var(--muted)}
.rm{border:0}
@media screen and (max-width:640px){.sheet{padding:22px 16px;border-radius:0}.parties,.bottom{grid-template-columns:1fr}.parties .r input,.parties .r textarea{text-align:left}.table-wrap{overflow-x:auto}table{min-width:560px}.head{flex-direction:column}.title{text-align:left}.meta{justify-content:start}}
@media screen and (max-width:640px){.thd{display:none}.trow{grid-template-columns:1fr 1fr 1fr}.trow .rt,.trow .per{grid-column:1/-1}.per{flex-direction:row}.trow .ttot,.trow .acts{grid-column:auto}}@media print{.acts,.addst{display:none!important}body{background:#fff}.bar,.noprint{display:none!important}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}input,textarea{border-color:transparent!important;background:transparent!important;resize:none}@page{margin:14mm}th{-webkit-print-color-adjust:exact;print-color-adjust:exact}.logo,.tot .due,tbody tr:nth-child(even){-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media print{html,body{font-size:11px}@page{margin:9mm}.sc{zoom:var(--pz,1)}.logo{width:52px;height:52px}.logo input{width:52px;font-size:13px}.title h1{font-size:20px;margin-bottom:4px}.meta{font-size:11px}.parties{margin:12px 0;gap:16px}.parties input.big{font-size:14px}input,textarea{padding:0!important;font-size:11px}textarea{min-height:0}.trow{padding:3px 4px}.thd{padding:5px 4px}.rt{gap:0}.mk{width:9px;height:9px}.pl input{width:84px;font-size:11px}.sign{margin-top:14px}.bottom{gap:16px}input[type=date]::-webkit-calendar-picker-indicator,input[type=number]::-webkit-inner-spin-button{display:none}}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:6px 0;border-bottom:1px solid #8884}.li button{padding:4px 10px;margin-left:6px}
@media print{:root{padding:0}html,body{height:auto;margin:0}.sheet{margin:0!important;min-height:0;border-radius:0;overflow:visible}.sign{margin-top:8px}.notes,textarea{field-sizing:content;height:auto;overflow:hidden}@page{size:A4;margin:9mm}.sign{padding-top:64px}.sign img{height:58px}.thd span:last-child{display:none}.thd,.trow{grid-template-columns:1fr 128px 54px 90px 100px}.pl.e{display:none}.nd .per,.nd .thd span:nth-child(2){display:none}.nd .thd,.nd .trow{grid-template-columns:1fr 54px 90px 100px}}
</style>
</head>
<body>
<div class="bar">
  <b>Faturas de táxi <small id="st" style="font-weight:400;opacity:.7"></small></b>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <select id="pz" aria-label="Escala de impressão" title="Reduza a escala para caber mais viagens numa página"><option value="auto">Impressão: auto (1 página)</option><option value="1">Impressão 100%</option><option value="0.9">Impressão 90%</option><option value="0.8">Impressão 80%</option><option value="0.7">Impressão 70%</option><option value="0.6">Impressão 60%</option></select>
    <select id="cur" aria-label="Moeda"><option>MZN</option><option>USD</option><option>ZAR</option><option>EUR</option></select>
    <button onclick="toggleList()">Faturas guardadas</button>
    <button onclick="startNew()">Nova fatura</button>
    <button class="pri" onclick="window.print()">Imprimir / Guardar PDF</button>
  </span>
</div>
<div class="bar noprint" id="list" style="display:none;flex-direction:column;align-items:stretch"></div>

<main class="sheet" id="sheet">
  <div class="head">
    <div class="logo"><input id="ini" value="COSS" maxlength="4" aria-label="Iniciais"></div>
    <div class="title">
      <h1>Fatura</h1>
      <div class="meta">
        <span>Fatura n.º</span><input id="num">
        <span>Data</span><input id="date" type="date">
        <span>Vencimento</span><input id="due" type="date">
      </div>
    </div>
  </div>

  <div class="parties">
    <div>
      <h3>De</h3>
      <input class="big" id="co" value="COSS Mobility Solutions" aria-label="Empresa">
      <input id="coc" value="Nélio Cossa" aria-label="Responsável">
      <input id="coe" value="neliojotamo@gmail.com" aria-label="Email">
      <input id="cot" placeholder="Telefone" aria-label="Telefone">
      <input id="coa" value="Maputo, Moçambique" aria-label="Morada">
    </div>
    <div class="r">
      <h3 style="text-align:right">Cobrar a</h3>
      <input class="big" id="cl" placeholder="Nome do cliente" aria-label="Cliente">
      <input id="cle" placeholder="Email do cliente" aria-label="Email do cliente">
      <input id="clt" placeholder="Telefone" aria-label="Telefone do cliente">
      <input id="clu" placeholder="NUIT (opcional)" aria-label="NUIT do cliente">
      <input id="cla" placeholder="Morada" aria-label="Morada do cliente">
    </div>
  </div>

  <div class="thd"><span>Percurso</span><span>Período</span><span>Viagens</span><span>Preço unit.</span><span>Total</span><span></span></div>
  <div id="trips"></div>
  <button class="noprint" onclick="addTrip()" style="margin:0 0 24px">+ Adicionar percurso</button>
  <button id="xbtn" class="noprint" onclick="addRow();auto()" style="margin:0 0 20px">+ Adicionar extras e outros serviços</button>
  <div id="xsec" style="display:none">
  <h3 style="margin:0 0 6px;font-size:13px">Extras e outros serviços</h3>

  <div class="table-wrap">
  <table>
    <thead><tr><th>Descrição</th><th style="width:100px">Tarifa</th><th style="width:60px">Qtd.</th><th style="width:110px">Total</th><th class="noprint" style="width:30px"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  <button class="noprint addrow" onclick="addRow();auto()">+ Adicionar linha</button>
  </div>

  <div class="bottom">
    <div>
      <div class="sec" style="margin-top:18px"><h3>Instruções de pagamento</h3>
        <textarea id="pay">M-Pesa: 849670336
Transferência bancária (NIB): 000100000040785822957 (BIM)</textarea></div>
      <div class="sec" style="margin-top:14px"><h3>Notas</h3>
        <textarea id="notes">Obrigado por viajar connosco.</textarea></div>
    </div>
    <div class="tot">
      <span class="sub">Total parcial</span><span class="v sub" id="t-sub"></span>
      <span>Desconto (<input id="disc" type="number" min="0" max="100" value="0">%)</span><span class="v" id="t-disc"></span>
      
      
      <span class="sub">Total</span><span class="v sub" id="t-tot"></span>
      <span>Valor pago</span><span class="v"><input id="paid" type="number" min="0" value="0"></span>
      <div class="due"><span>Saldo em dívida</span><span id="t-due"></span></div>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/"/g,'&quot;');
let trips=[];
function fmt(n){return $('cur').value+' '+n.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function newTrip(){return{d1:'',d2:'',qty:1,val:'',stops:['','']}}
function tripEl(t,ti){
  const d=document.createElement('div');d.className='trow';const n=t.stops.length;
  const parts=t.stops.map((s,i)=>{const f=i===0,l=i===n-1;
    const ph=f?'Partida':l?'Destino':'Paragem';
    const inp=`<input data-s="${i}" value="${esc(s)}" placeholder="${ph}" aria-label="${ph}">`;
    const mk=`<i class="mk ${f?'a':l?'z':'m'}"></i>`;
    return (i?'<span class="ar">→</span>':'')+`<span class="sw">${mk}${inp}${f||l?'':`<button class="x noprint" data-a="ds" data-i="${i}" aria-label="Remover paragem">×</button>`}</span>`}).join('');
  d.innerHTML=`<div class="rt">${parts}<button class="addst noprint" data-a="stop" title="Adicionar paragem" style="padding:3px 8px">+ paragem</button></div>
  <div class="per"><label class="pl">De<input type="date" data-k="d1" value="${t.d1}"></label><label class="pl">Até<input type="date" data-k="d2" value="${t.d2}"></label></div>
  <input data-k="qty" type="number" min="1" step="1" value="${t.qty}" aria-label="Número de viagens">
  <input data-k="val" type="number" min="0" step="0.01" value="${t.val}" aria-label="Preço unitário">
  <span class="ttot"></span>
  <span class="acts noprint"><button data-a="dup" title="Duplicar linha" aria-label="Duplicar">⧉</button><button data-a="rev" title="Inverter percurso" aria-label="Inverter">⇄</button>${trips.length>1?'<button class="x" data-a="del" title="Remover" aria-label="Remover viagem">×</button>':''}</span>`;
  return d;
}
function render(){const el=$('trips');el.innerHTML='';trips.forEach((t,i)=>el.appendChild(tripEl(t,i)));calc()}
function addTrip(){trips.push(newTrip());render();auto()}
$('trips').addEventListener('input',e=>{const el=e.target,ti=[...$('trips').children].indexOf(el.closest('.trow'));if(ti<0)return;
  if(el.dataset.s!==undefined)trips[ti].stops[+el.dataset.s]=el.value;else if(el.dataset.k)trips[ti][el.dataset.k]=el.value;calc()});
$('trips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ti=[...$('trips').children].indexOf(b.closest('.trow')),t=trips[ti];
  switch(b.dataset.a){case 'dup':trips.splice(ti+1,0,JSON.parse(JSON.stringify(t)));break;case 'rev':t.stops.reverse();break;case 'del':trips.splice(ti,1);break;case 'stop':t.stops.splice(t.stops.length-1,0,'');break;case 'ds':t.stops.splice(+b.dataset.i,1);break;default:return}
  render();auto()});
function addRow(d='',r='',q=1){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td><input value="${esc(d)}" placeholder="Espera, bagagem, portagem…"></td><td><input type="number" min="0" step="0.01" value="${r}"></td><td><input type="number" min="0" step="1" value="${q}"></td><td class="amt"></td><td class="noprint"><button class="x rm" aria-label="Remover linha">×</button></td>`;
  tr.querySelector('.rm').onclick=()=>{tr.remove();calc();auto()};
  tr.querySelectorAll('input').forEach(i=>i.oninput=calc);
  $('rows').appendChild(tr);calc();
}
function calc(){
  let sub=0,any=false;const disc=(+$('disc').value||0)/100;
  trips.forEach((t,i)=>{const a=(+t.val||0)*(+t.qty||0);sub+=a;const c=$('trips').children[i];if(t.d1||t.d2)any=true;if(c){c.querySelector('.ttot').textContent=fmt(a);c.querySelectorAll('.pl').forEach((l,j)=>l.classList.toggle('e',!(j?t.d2:t.d1)))}});
  $('sheet').classList.toggle('nd',!any);
  $('rows').querySelectorAll('tr').forEach(tr=>{
    const v=tr.querySelectorAll('input');
    const amt=(+v[1].value||0)*(+v[2].value||0);
    tr.querySelector('.amt').textContent=fmt(amt);
    sub+=amt;
  });
  const nr=$('rows').children.length;$('xsec').style.display=nr?'':'none';$('xbtn').style.display=nr?'none':'';
  const dsc=sub*disc;
  const total=sub-dsc;
  $('t-sub').textContent=fmt(sub);$('t-disc').textContent='− '+fmt(dsc);
  $('t-tot').textContent=fmt(total);
  $('t-due').textContent=fmt(Math.max(0,total-(+$('paid').value||0)));autoScale();
}
function nextNum(peek){
  let n=1;try{n=(+localStorage.getItem('taxiInv')||0)+1;if(!peek)localStorage.setItem('taxiInv',n)}catch(e){}
  return new Date().getFullYear()+'-'+String(n).padStart(4,'0');
}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function newInv(){
  const today=new Date().toISOString().slice(0,10);
  $('num').value=nextNum(false);$('date').value=today;$('due').value=addDays(today,7);
  ['cl','cle','clt','clu','cla'].forEach(i=>$(i).value='');
  $('disc').value=0;$('paid').value=0;
  trips=[newTrip()];$('rows').innerHTML='';render();curId=uid();save();
}
['cur','disc','paid'].forEach(i=>$(i).oninput=calc);
$('cur').onchange=calc;
function autoScale(){let z=1;const v=$('pz').value;if(v==='auto'){let h=500;trips.forEach(t=>{h+=9+17*t.stops.length});const nr=$('rows').children.length;if(nr)h+=34+nr*26;z=Math.max(.45,Math.min(1,980/h))}else z=+v;z=Math.floor(z*100)/100;document.documentElement.style.setProperty('--pz',z);$('sheet').classList.toggle('sc',z<1)}
$('pz').onchange=autoScale;
// guardar dados da empresa (conveniência por navegador)
const keep=['ini','co','coc','coe','cot','coa','pay','notes'];
try{keep.forEach(k=>{const v=localStorage.getItem('coss_'+k);if(v!==null)$(k).value=v});
const c=localStorage.getItem('coss_cur');if(c)$('cur').value=c}catch(e){}
keep.forEach(k=>$(k).addEventListener('input',()=>{try{localStorage.setItem('coss_'+k,$(k).value)}catch(e){}}));
$('cur').addEventListener('change',()=>{try{localStorage.setItem('coss_cur',$('cur').value)}catch(e){}});
/* ===== guardar faturas (neste navegador) ===== */
let curId=null,tm;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const FIELDS=['num','date','due','cl','cle','clt','clu','cla','disc','paid','co','coc','coe','cot','coa','pay','notes','ini'];
const st=m=>{$('st').textContent=m};
function db(){try{return JSON.parse(localStorage.getItem('coss_invoices')||'{}')}catch(e){return{}}}
function setDb(d){try{localStorage.setItem('coss_invoices',JSON.stringify(d))}catch(e){st('Não foi possível guardar')}}
function snapshot(){return{f:Object.fromEntries(FIELDS.map(k=>[k,$(k).value])),cur:$('cur').value,trips:JSON.parse(JSON.stringify(trips)),rows:[...$('rows').querySelectorAll('tr')].map(tr=>{const v=tr.querySelectorAll('input');return[v[0].value,v[1].value,v[2].value]})}}
const DEFPAY='M-Pesa: 849670336\nTransferência bancária (NIB): 000100000040785822957 (BIM)';
function load(o){FIELDS.forEach(k=>$(k).value=o.f[k]??'');if(!$('pay').value||$('pay').value.includes('(indique'))$('pay').value=DEFPAY;if(!$('coc').value)$('coc').value='Nélio Cossa';try{localStorage.setItem('coss_pay',$('pay').value)}catch(e){}$('cur').value=o.cur||'MZN';trips=o.trips.map(t=>Object.assign(newTrip(),t));$('rows').innerHTML='';o.rows.forEach(r=>addRow(r[0],r[1],r[2]));render()}
function save(){if(!curId)return;const d=db();d[curId]={u:Date.now(),n:$('num').value,c:$('cl').value,t:$('t-tot').textContent,k:trips.length,data:snapshot()};setDb(d);try{localStorage.setItem('coss_current',curId)}catch(e){}st('Guardado ✓')}
function auto(){st('A guardar…');clearTimeout(tm);tm=setTimeout(save,400)}
document.addEventListener('input',auto);document.addEventListener('change',auto);
function startNew(){save();newInv();$('list').style.display='none'}
function toggleList(){const p=$('list');if(p.style.display==='flex'){p.style.display='none';return}renderList();p.style.display='flex'}
function renderList(){
  const p=$('list');p.innerHTML='';const d=db();const ids=Object.keys(d).sort((a,b)=>d[b].u-d[a].u);
  if(!ids.length){p.textContent='Ainda não há faturas guardadas.';return}
  ids.forEach(id=>{const e=d[id],r=document.createElement('div');r.className='li';
    const t=document.createElement('span');t.textContent=`${e.n||'(sem n.º)'} · ${e.c||'sem cliente'} · ${e.k} percurso(s) · ${e.t}`;if(id===curId)t.style.fontWeight='700';
    const b=document.createElement('span');
    const o=document.createElement('button');o.textContent=id===curId?'Aberta':'Abrir';o.disabled=id===curId;
    o.onclick=()=>{save();curId=id;load(db()[id].data);try{localStorage.setItem('coss_current',id)}catch(x){}st('Fatura aberta');p.style.display='none'};
    const x=document.createElement('button');x.textContent='Apagar';
    x.onclick=()=>{if(x.dataset.c){const d2=db();delete d2[id];setDb(d2);if(id===curId)newInv();renderList()}else{x.dataset.c=1;x.textContent='Confirmar?'}};
    b.append(o,x);r.append(t,b);p.appendChild(r)});
}
(function(){let e=null,c=null;try{c=localStorage.getItem('coss_current');e=db()[c]}catch(x){}
  if(e){curId=c;load(e.data);st('Fatura retomada')}else newInv();})();
</script>
</body>
</html>
